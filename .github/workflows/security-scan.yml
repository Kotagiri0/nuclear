name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-security-scan:
    name: CI / Tests + Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit and integration tests
        run: pytest -q

      - name: Run scanner policy gate and generate reports
        id: scan
        shell: bash
        run: |
          mkdir -p artifacts
          set +e

          nuclear-scan scanner --min-severity LOW --fail-on HIGH --exclude scanner/output/recommendations.py --format json --output artifacts/scan-report.json --recommendations
          json_exit=$?

          nuclear-scan scanner --min-severity LOW --fail-on HIGH --exclude scanner/output/recommendations.py --format sarif --output artifacts/scan-report.sarif
          sarif_exit=$?

          if [ "$json_exit" -ne 0 ] || [ "$sarif_exit" -ne 0 ]; then
            echo "gate_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_failed=false" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload scanner artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: artifacts/
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('artifacts/scan-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/scan-report.sarif

      - name: Enforce secret policy gate
        if: steps.scan.outputs.gate_failed == 'true'
        run: |
          echo "HIGH/CRITICAL findings detected. See artifacts/scan-report.json."
          exit 1
