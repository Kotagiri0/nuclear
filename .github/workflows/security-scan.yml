name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-and-security-scan:
    name: CI / Tests + Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run strict test gate (warnings + coverage)
        run: |
          pytest -q --strict-markers --strict-config -W error --maxfail=1 \
            --cov=scanner.core \
            --cov=scanner.output.policy \
            --cov=scanner.output.reporting \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Run concrete security regression tests
        run: |
          pytest -q \
            tests/tests/test_scanner.py \
            tests/tests/test_scanning.py \
            tests/tests/test_runner.py \
            tests/tests/test_reporting_full.py \
            tests/tests/test_cli_integration.py \
            tests/tests/test_analysis_branches.py \
            tests/tests/test_patterns_direct.py \
            -W error --maxfail=1

      - name: Run scanner e2e regression checks (vuln vs clean)
        shell: bash
        run: |
          set -e
          set +e
          nuclear-scan tests/resources/dir/corpus/projects/py_vuln_small --fail-on LOW --quiet
          vuln_exit=$?
          set -e
          if [ "$vuln_exit" -eq 0 ]; then
            echo "Expected vulnerable fixture to fail the gate, but got exit code 0"
            exit 1
          fi

          nuclear-scan tests/resources/dir/corpus/projects/py_clean_small --fail-on LOW --quiet

      - name: Run scanner policy gate and generate reports
        id: scan
        shell: bash
        run: |
          mkdir -p artifacts
          set +e

          nuclear-scan scanner --min-severity LOW --fail-on HIGH --exclude scanner/output/recommendations.py --exclude scanner/core/patterns.py --format json --output artifacts/scan-report.json --recommendations
          json_exit=$?

          nuclear-scan scanner --min-severity LOW --exclude scanner/output/recommendations.py --exclude scanner/core/patterns.py --format sarif --output artifacts/scan-report.sarif --recommendations
          sarif_exit=$?

          if [ "$json_exit" -ne 0 ]; then
            echo "gate_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_failed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$sarif_exit" -ne 0 ]; then
            echo "SARIF generation returned non-zero exit code: $sarif_exit"
          fi

          exit 0

      - name: Upload scanner artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: artifacts/
          if-no-files-found: ignore

      - name: Enforce secret policy gate
        if: steps.scan.outputs.gate_failed == 'true'
        run: |
          echo "HIGH/CRITICAL findings detected. See artifacts/scan-report.json."
          exit 1
