[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-secret-scanner"
version = "0.2.0"
description = "Advanced secret and sensitive data scanner with URL/history and CI policy gate"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "nuclear" }]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
]

[project.scripts]
nuclear-scan = "secret_scanner.cli:main"
nuclear = "secret_scanner.repl:run"

[tool.setuptools]
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secret_scanner*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["tests/dir/github_real"]
